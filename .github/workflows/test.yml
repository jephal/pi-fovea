name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: ast-grep
        run: npm i -g @ast-grep/cli
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
