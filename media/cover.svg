<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
  <title id="title">pi-fovea cover</title>
  <desc id="desc">A code graph seen through a fovea: an ink bloom reveals the graph from its hot amber core, pulses of light stream inward along the edges, and focus rings ripple, rotate, and breathe.</desc>
  <defs>
    <radialGradient id="fovea" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb454" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#ff7a3d" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#b3452e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a3441" stop-opacity="0.2">
        <animate attributeName="stop-opacity" values="0.2;0.35;0.2" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#ffb454" stop-opacity="0.55">
        <animate attributeName="stop-opacity" values="0.55;0.75;0.55" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#2a3441" stop-opacity="0.2">
        <animate attributeName="stop-opacity" values="0.2;0.35;0.2" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="90" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="reveal">
      <rect width="1100" height="330" fill="black"/>
      <circle cx="550" cy="165" r="0" fill="white" filter="url(#ink)">
        <animate attributeName="r" values="0;0;700" keyTimes="0;0.0909;1" dur="11s" fill="freeze" calcMode="spline" keySplines="0 0 1 1; 0.22 0.61 0.36 1"/>
      </circle>
    </mask>
  </defs>
  <rect width="1100" height="330" fill="#0a0e14"/>
  <g mask="url(#reveal)">
    <path d="M550 165 L740.3 76.2 A 210 210 0 0 1 740.3 253.8 Z" fill="#ffcf8a" opacity="0.045">
      <animateTransform attributeName="transform" type="rotate" from="0 550 165" to="360 550 165" dur="26s" repeatCount="indefinite"/>
    </path>
    <g opacity="0.55" stroke="url(#edge)" fill="none">
      <path id="e1" d="M60 258 L550 165" stroke-width="1.4"/>
