      <circle cx="140" cy="88" r="4"><animate attributeName="opacity" values="0.5;1;0.5" dur="7.7s" begin="-2.6s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="298" r="4.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="5.4s" begin="-1.7s" repeatCount="indefinite"/></circle>
