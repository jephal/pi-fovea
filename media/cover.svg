        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="8.8s" begin="-6.3s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.4">
        <animateMotion dur="5.9s" begin="-3.5s" repeatCount="indefinite"><mpath xlink:href="#e9"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="5.9s" begin="-3.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="3">
        <animateMotion dur="6.4s" begin="-0.2s" repeatCount="indefinite"><mpath xlink:href="#e10"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="6.4s" begin="-0.2s" repeatCount="indefinite"/>
      </circle>
