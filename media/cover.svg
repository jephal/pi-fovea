      <circle cx="980" cy="130" r="4"><animate attributeName="opacity" values="0.5;1;0.5" dur="7.3s" begin="-5s" repeatCount="indefinite"/></circle>
      <circle cx="1030" cy="248" r="4"><animate attributeName="opacity" values="0.5;1;0.5" dur="8.1s" begin="-2.2s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="300" r="4"><animate attributeName="opacity" values="0.5;1;0.5" dur="6.5s" begin="-3.9s" repeatCount="indefinite"/></circle>
